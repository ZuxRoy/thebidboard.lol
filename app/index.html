<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TheBidBoard — claim your spot on the board." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700&family=Libre+Franklin:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>The BidBoard</title>

    <!--
      Open Graph / Twitter Card.
      Share https://thebidboard.lol/ — do not bump ?v= on the page for each listing.
      Crawlers (Twitterbot, etc.) get live og:image?v=<fingerprint> from /api/og-card.html
      via origin middleware (and the optional Cloudflare worker). ?v=2 is a static fallback.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thebidboard.lol/" />
    <meta property="og:title" content="The BidBoard" />
    <meta property="og:description" content="TheBidBoard — claim your spot on the board." />
    <meta property="og:image" content="https://api.thebidboard.lol/api/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The BidBoard" />
    <meta name="twitter:description" content="TheBidBoard — claim your spot on the board." />
    <meta name="twitter:image" content="https://api.thebidboard.lol/api/og-image.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
