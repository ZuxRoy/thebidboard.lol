<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TheBidBoard — claim your spot on the board." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700&family=Libre+Franklin:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>The BidBoard</title>

    <!--
      Open Graph / Twitter Card.
      The image is rendered live by the API. X caches by page URL and image URL.
      To refresh an existing X card after deploy:
        1. Purge Cloudflare for https://api.thebidboard.lol/api/og-image.png
        2. Share https://thebidboard.lol/?v=2 in a new X draft (composer preview is ground truth)
      Bare https://thebidboard.lol/ tweets keep the old card until X recrawls.
      The edge worker on thebidboard.lol rewrites og:image/?v= to the live board fingerprint for crawlers.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thebidboard.lol/" />
    <meta property="og:title" content="The BidBoard" />
    <meta property="og:description" content="TheBidBoard — claim your spot on the board." />
    <meta property="og:image" content="https://api.thebidboard.lol/api/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The BidBoard" />
    <meta name="twitter:description" content="TheBidBoard — claim your spot on the board." />
    <meta name="twitter:image" content="https://api.thebidboard.lol/api/og-image.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
